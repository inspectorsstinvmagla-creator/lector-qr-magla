
<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Lector QR - Control de acceso Magla</title>

  <script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>

  <style>
    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, sans-serif;
      background: #f1f5f9;
      color: #1e293b;
    }

    main {
      max-width: 500px;
      margin: 20px auto;
      padding: 22px;
      background: white;
      border-radius: 16px;
      box-shadow: 0 4px 18px #00000012;
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
      text-align: center;
    }

    p { line-height: 1.5; text-align: center; }

    #lectorQR {
      width: 100%;
      margin: 20px auto;
      overflow: hidden;
      border-radius: 10px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 10px;
      border: 0;
      border-radius: 9px;
      background: #166534;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    #detener { background: #b91c1c; }
    #copiar { background: #475569; }

    #estado {
      padding: 12px;
      background: #f1f5f9;
      border-radius: 8px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
    }

    #resultado {
      display: none;
      padding: 14px;
      margin-top: 15px;
      background: #dcfce7;
      border-radius: 8px;
      overflow-wrap: anywhere;
    }

    #codigoLeido {
      font-size: 18px;
      font-weight: bold;
      text-align: center;
      overflow-wrap: anywhere;
      word-break: break-word;
    }
  </style>
</head>

<body>
  <main>
    <h1>📷 Lector QR Magla</h1>

    <p>
      Lector de códigos QR para el control de acceso
      de las obras.
    </p>

    <div id="estado">Preparado para iniciar la cámara.</div>

    <div id="lectorQR"></div>

    <button id="iniciar" type="button">
      Activar cámara
    </button>

    <button id="detener" type="button" disabled>
      Detener cámara
    </button>

    <div id="resultado">
      <p id="tituloResultado">Código QR detectado:</p>
      <div id="codigoLeido"></div>

      <button id="copiar" type="button">Copiar código</button>
      <button id="leerOtro" type="button">Leer otro código</button>
    </div>
  </main>

  <script>
    (() => {
      "use strict";

      let lector = null;
      let camaraActiva = false;
      let codigoDetectado = false;
      let procesando = false;

      const estado = document.getElementById("estado");
      const botonIniciar = document.getElementById("iniciar");
      const botonDetener = document.getElementById("detener");
      const botonCopiar = document.getElementById("copiar");
      const botonLeerOtro = document.getElementById("leerOtro");
      const resultado = document.getElementById("resultado");
      const codigoLeido = document.getElementById("codigoLeido");
      const tituloResultado = document.getElementById("tituloResultado");

      function mostrarError(error) {
        console.error("Error del lector QR:", error);

        const nombre = error && error.name ? error.name : "Error";
        const mensaje = error && error.message
          ? error.message
          : String(error || "Error desconocido");

        estado.textContent =
          "No se pudo iniciar la cámara.\n" +
          nombre + ": " + mensaje +
          "\n\nComprueba que el sitio tenga permiso para usar la cámara.";
      }

      async function iniciarCamara() {
        if (camaraActiva || procesando) return;

        botonIniciar.disabled = true;
        estado.textContent = "Comprobando cámara y permisos...";

        try {
          if (!window.isSecureContext) {
            throw new Error(
              "La página debe abrirse mediante HTTPS."
            );
          }

          if (!navigator.mediaDevices ||
              !navigator.mediaDevices.getUserMedia) {
            throw new Error(
              "Este navegador no ofrece acceso a la cámara. " +
              "Abre el enlace con Chrome actualizado."
            );
          }

          if (typeof window.Html5Qrcode === "undefined") {
            throw new Error(
              "No se cargó la biblioteca del lector QR. " +
              "Comprueba tu conexión y recarga la página."
            );
          }

          if (!lector) {
            lector = new Html5Qrcode("lectorQR");
          }

          estado.textContent = "Solicitando permiso para usar la cámara...";

          try {
            await lector.start(
              { facingMode: "environment" },
              {
                fps: 10,
                qrbox: { width: 230, height: 230 },
                aspectRatio: 1
              },
              (texto) => {
                if (codigoDetectado || procesando) return;
                procesarCodigoLeido(texto);
              },
              () => {}
            );
          } catch (errorInicial) {
            // Algunos dispositivos no aceptan facingMode.
            // En ese caso se intenta seleccionar una cámara disponible.
            if (
              errorInicial &&
              (
                errorInicial.name === "OverconstrainedError" ||
                errorInicial.name === "NotFoundError" ||
                errorInicial.name === "NotReadableError"
              )
            ) {
              const camaras = await Html5Qrcode.getCameras();

              if (!camaras || camaras.length === 0) {
                throw errorInicial;
              }

              const camaraTrasera =
                camaras.find(c => /back|rear|environment|trasera|posterior/i.test(c.label))
                || camaras[camaras.length - 1];

              await lector.start(
                camaraTrasera.id,
                {
                  fps: 10,
                  qrbox: { width: 230, height: 230 },
                  aspectRatio: 1
                },
                (texto) => {
                  if (codigoDetectado || procesando) return;
                  procesarCodigoLeido(texto);
                },
                () => {}
              );
            } else {
              throw errorInicial;
            }
          }

          camaraActiva = true;
          botonDetener.disabled = false;
          estado.textContent = "Cámara activa. Enfoca un código QR.";
        } catch (error) {
          mostrarError(error);

          camaraActiva = false;
          botonDetener.disabled = true;

          if (lector) {
            try {
              await lector.stop();
            } catch (e) {}

            try {
              await lector.clear();
            } catch (e) {}

            lector = null;
          }
        } finally {
          botonIniciar.disabled = false;
        }
      }

      async function procesarCodigoLeido(texto) {
        if (codigoDetectado || procesando) return;

        codigoDetectado = true;
        procesando = true;

        codigoLeido.textContent = texto;
        resultado.style.display = "block";
        tituloResultado.textContent = "Código QR detectado:";
        estado.textContent = "Código leído. Deteniendo la cámara...";

        if (lector && camaraActiva) {
          try {
            await lector.stop();
          } catch (error) {
            console.warn("No se pudo detener la cámara:", error);
          }
        }

        camaraActiva = false;
        botonDetener.disabled = true;

        try {
          if (window.opener && !window.opener.closed) {
            window.opener.postMessage({
              type: "MAGLA_QR_SCAN",
              code: texto,
              timestamp: Date.now()
            }, "*");

            tituloResultado.textContent =
              "Código leído y enviado a la aplicación:";

            estado.textContent =
              "Código enviado. Regresando a la aplicación...";

            // El mensaje se envía antes de cerrar esta ventana.
            setTimeout(() => {
              window.close();

              // Si el navegador impide cerrar la ventana,
              // el código sigue visible para copiarlo.
              estado.textContent =
                "Si esta ventana no se cerró automáticamente, " +
                "vuelve a la aplicación principal.";
              procesando = false;
            }, 700);
          } else {
            tituloResultado.textContent = "Código QR detectado:";
            estado.textContent =
              "No se encontró la ventana principal. " +
              "Puedes copiar el código o leer otro.";
            procesando = false;
          }
        } catch (error) {
          tituloResultado.textContent = "Código QR detectado:";
          estado.textContent =
            "No se pudo enviar el código. Puedes copiarlo manualmente.";
          procesando = false;
        }
      }

      async function detenerCamara() {
        botonDetener.disabled = true;

        if (lector && camaraActiva) {
          try {
            await lector.stop();
          } catch (error) {
            console.warn("Error al detener cámara:", error);
          }
        }

        if (lector) {
          try {
            await lector.clear();
          } catch (error) {}
        }

        lector = null;
        camaraActiva = false;
        botonIniciar.disabled = false;
        estado.textContent = "Cámara detenida. Puedes volver a activarla.";
      }

      async function copiarCodigo() {
        const texto = codigoLeido.textContent;

        try {
          await navigator.clipboard.writeText(texto);
          estado.textContent = "Código copiado correctamente.";
        } catch (error) {
          estado.textContent =
            "No se pudo copiar automáticamente. Selecciona el código y cópialo manualmente.";
        }
      }

      function leerOtro() {
        codigoDetectado = false;
        procesando = false;
        resultado.style.display = "none";
        codigoLeido.textContent = "";
        tituloResultado.textContent = "Código QR detectado:";
        estado.textContent = camaraActiva
          ? "Cámara activa. Enfoca otro código QR."
          : "Pulsa Activar cámara para comenzar.";

        if (!camaraActiva) {
          iniciarCamara();
        }
      }

      // Se conectan los eventos desde JavaScript.
      // Así podemos mostrar errores incluso si el botón no tiene onclick.
      botonIniciar.addEventListener("click", () => {
        iniciarCamara().catch(mostrarError);
      });

      botonDetener.addEventListener("click", () => {
        detenerCamara().catch(mostrarError);
      });

      botonCopiar.addEventListener("click", () => {
        copiarCodigo().catch(mostrarError);
      });

      botonLeerOtro.addEventListener("click", leerOtro);

      window.addEventListener("error", (evento) => {
        console.error("Error JavaScript:", evento.message);
        estado.textContent =
          "Error JavaScript: " + evento.message;
      });

      window.addEventListener("unhandledrejection", (evento) => {
        mostrarError(evento.reason);
      });

      window.addEventListener("beforeunload", () => {
        if (lector && camaraActiva) {
          lector.stop().catch(() => {});
        }
      });
    })();
  </script>
  <div style="padding:20px;background:yellow;color:black;font-size:20px">
  PRUEBA MAGLA: SI VES ESTO, EL HTML SE ACTUALIZÓ
</div>
</body>
</html>
